<title>CLARITY</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overscroll-behavior:none;}
:root{--bg:#0c0c0c;--s1:#111;--s2:#161616;--s3:#1e1e1e;--b:#222;--b2:#1a1a1a;--t:#efefef;--t2:#888;--t3:#444;--t4:#2a2a2a;--a:#c9ff3f;--at:#111;}
.light .logo{text-shadow:0 1px 6px rgba(0,0,0,.2);}
.light .logo{color:#0d0d0d;}
.light{--bg:#f5f5f2;--s1:#fff;--s2:#f0f0ec;--s3:#e5e4e0;--b:#e0e0dc;--b2:#e8e8e4;--t:#111;--t2:#666;--t3:#aaa;--t4:#ccc;}

/* ── SPLASH ── */
.sp{position:fixed;inset:0;background:#0c0c0c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3000;transition:opacity .5s;}
.sp.out{opacity:0;pointer-events:none;}
.sp-logo{font-size:38px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#efefef;opacity:0;transform:translateY(14px);animation:spi .9s ease .3s forwards;}
.sp-logo em{color:#c9ff3f;font-style:normal;}
.sp-sub{font-size:10px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:#2a2a2a;margin-top:10px;opacity:0;animation:spi .7s ease 1s forwards;}
.sp-bar{width:48px;height:2px;background:#181818;border-radius:99px;margin-top:32px;overflow:hidden;opacity:0;animation:spi .4s ease 1.3s forwards;}
.sp-fill{height:100%;background:#c9ff3f;border-radius:99px;width:0;animation:spf 1.1s ease 1.5s forwards;}
@keyframes spi{to{opacity:1;transform:translateY(0);}}
@keyframes spf{to{width:100%;}}

/* ── ONBOARDING ── */
.ob{position:fixed;inset:0;background:#0c0c0c;z-index:2000;display:flex;flex-direction:column;opacity:0;transition:opacity .4s;pointer-events:none;}
.ob.show{opacity:1;pointer-events:all;}
.ob-wrap{flex:1;overflow:hidden;}
.ob-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1);}
.ob-slide{min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;}
.ob-ico{font-size:56px;margin-bottom:28px;}
.ob-ttl{font-size:24px;font-weight:700;color:#efefef;margin-bottom:12px;line-height:1.2;}
.ob-ttl em{color:#c9ff3f;font-style:normal;}
.ob-txt{font-size:14px;font-weight:300;color:#555;line-height:1.8;max-width:280px;}
.ob-txt b{color:#c9ff3f;font-weight:600;}
.ob-foot{padding:24px 32px 44px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.ob-dots{display:flex;gap:7px;}
.ob-dot{width:6px;height:6px;border-radius:99px;background:#1e1e1e;transition:all .3s;}
.ob-dot.on{background:#c9ff3f;width:22px;}
.ob-btn{width:100%;max-width:320px;background:#c9ff3f;color:#111;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;padding:16px;cursor:pointer;}
.ob-skip{border:none;background:none;font-family:inherit;font-size:12px;color:#2a2a2a;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;}

/* ── APP ── */
.app{opacity:0;transition:opacity .4s;min-height:100vh;}
.app.show{opacity:1;}

/* ── NAV ── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:15px 20px 13px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:50;}
.logo{font-size:14px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--a);}
.nav-r{display:flex;gap:5px;}
.nb{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--b);background:var(--s1);color:var(--t3);cursor:pointer;font-size:11px;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;letter-spacing:.5px;}
.nb:hover{border-color:var(--a);color:var(--t);}

/* ── TABS ── */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--b);}
.tab{border:none;background:none;font-family:inherit;font-size:8.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--t4);padding:12px 2px;cursor:pointer;border-bottom:1.5px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s;text-align:center;}
.tab:hover{color:var(--t3);}
.tab.on{color:var(--t);border-bottom-color:var(--a);}

/* ── PAGES ── */
.pg{display:none;padding:18px 18px 20px;}
.pg.on{display:block;}
.sec{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;margin-top:22px;}
.sec:first-child{margin-top:0;}

/* ── HERO ── */
.hero{
  padding:20px 18px 16px;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}
.hero-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  margin-bottom:14px;
}
.rw{
  position:relative;
  width:160px;
  height:160px;
  flex-shrink:0;
  margin-bottom:10px;
}
.rw svg{width:160px;height:160px;transform:rotate(-90deg);display:block;}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rp{font-size:36px;font-weight:200;line-height:1;letter-spacing:-2px;color:var(--t);}
.rl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-top:5px;text-align:center;}
.hero-info{text-align:center;width:100%;}
.hdate{font-size:10px;color:var(--t3);letter-spacing:.3px;margin-bottom:4px;}
.hq{font-size:13px;font-weight:300;line-height:1.45;color:var(--t2);margin-bottom:0;}

/* ── STATS ROW ── */
.stats-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border:1px solid var(--b2);
  border-radius:12px;
  overflow:hidden;
  width:100%;
}
.stat-box{
  background:var(--s2);
  padding:13px 4px;
  text-align:center;
  border-right:1px solid var(--b2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.stat-box:last-child{border-right:none;}
.stat-box .v{
  font-size:22px;
  font-weight:300;
  line-height:1;
  display:block;
  margin-bottom:5px;
  color:var(--t);
  min-width:0;
}
.stat-box .l{
  font-size:8px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
  display:block;
  color:var(--t3);
}

/* ── CATS ── */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.cat{display:flex;align-items:center;gap:5px;border:1px solid var(--b);border-radius:99px;background:var(--s1);font-size:11px;font-weight:500;color:var(--t3);padding:6px 12px;cursor:pointer;transition:all .15s;}
.cat .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cat.on{font-weight:700;}

/* ── ADD ROW ── */
.add-wrap{display:flex;gap:8px;margin-bottom:18px;background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:10px 12px;transition:border-color .15s;}
.add-wrap:focus-within{border-color:var(--a);}
.ai{flex:1;border:none;background:none;font-family:inherit;font-size:14px;color:var(--t);outline:none;}
.ai::placeholder{color:var(--t3);}
.ab{background:var(--a);color:var(--at);border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;padding:8px 14px;cursor:pointer;white-space:nowrap;}

/* ── TASKS ── */
.tlist{display:flex;flex-direction:column;gap:2px;}
.tc{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);transition:background .12s;}
.tc:active{background:var(--s2);}
.tc.done{opacity:.35;}
.tc.done .tn{text-decoration:line-through;}
.ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;font-weight:700;color:var(--at);transition:all .15s;}
.ck:hover{border-color:var(--a);}
.ti{flex:1;min-width:0;}
.tn{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t);}
.tbg{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:4px;}
.ttm{font-size:10px;color:var(--t3);flex-shrink:0;}
.tdl{border:none;background:none;color:var(--t4);cursor:pointer;font-size:18px;padding:0 2px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.tc:hover .tdl{opacity:1;}

.empty{text-align:center;padding:36px 20px;border:1px dashed var(--b);border-radius:14px;}
.ei{font-size:22px;opacity:.18;margin-bottom:10px;}
.et{font-size:12px;color:var(--t3);line-height:1.9;font-weight:300;}

/* ── NOTIF ── */
.nt-bar{background:var(--s1);border:1px solid var(--a);border-radius:14px;padding:13px 15px;display:none;align-items:center;gap:10px;margin-bottom:14px;}
.nt-bar.show{display:flex;}
.nt-txt{flex:1;font-size:12px;color:var(--t2);line-height:1.4;}
.nt-txt b{color:var(--t);font-weight:600;}
.nt-btn{background:var(--a);color:var(--at);border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;padding:8px 13px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ── WEEK PLANNER MOBILE ── */
.week-days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.wday-card{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:16px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.wday-card:active{transform:scale(.97);}
.wday-card.today{border-color:var(--a);}
.wdc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wdc-name{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);}
.wday-card.today .wdc-name{color:var(--a);}
.wdc-ring{width:32px;height:32px;}
.wdc-ring svg{width:32px;height:32px;transform:rotate(-90deg);display:block;}
.wdc-date{font-size:13px;color:var(--t2);margin-bottom:10px;}
.wday-card.today .wdc-date{color:var(--t);font-weight:600;}
.wdc-bottom{display:flex;align-items:center;justify-content:space-between;}
.wdc-count{font-size:11px;color:var(--t3);}
.wdc-count.all-done{color:var(--a);font-weight:600;}
.wdc-arrow{font-size:18px;color:var(--t3);}

/* ── DAY MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--b);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;animation:mup .25s ease;}
@keyframes mup{from{transform:translateY(50px);opacity:0;}}

.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--b2);flex-shrink:0;}
.modal-title{font-size:17px;font-weight:600;color:var(--t);}
.modal-date{font-size:12px;color:var(--t3);margin-left:8px;}
.modal-close{border:none;background:var(--s2);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;}

/* cat selector in modal */
.modal-cats{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--b2);overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.modal-cats::-webkit-scrollbar{display:none;}
.mcat{display:flex;align-items:center;gap:5px;border:1px solid var(--b);border-radius:99px;background:var(--bg);font-size:11px;font-weight:500;color:var(--t3);padding:5px 11px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.mcat .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mcat.on{font-weight:700;}

.modal-body{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:3px;}

.modal-empty{text-align:center;padding:32px 20px;color:var(--t3);font-size:13px;font-weight:300;line-height:1.8;}
.modal-empty .mei{font-size:26px;opacity:.2;margin-bottom:10px;}

.mtask{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;background:var(--s2);font-size:14px;color:var(--t);transition:background .12s;}
.mtask:active{background:var(--s3);}
.mtask.done{opacity:.4;}
.mtask.done .mtn{text-decoration:line-through;}
.mck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;font-weight:700;color:var(--at);transition:all .15s;}
.mtn{flex:1;line-height:1.4;word-break:break-word;}
.mdel{border:none;background:none;color:var(--t4);cursor:pointer;font-size:18px;padding:0;opacity:0;transition:opacity .15s;flex-shrink:0;}
.mtask:hover .mdel,.mtask:active .mdel{opacity:1;}

.modal-add{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 20px 32px;border-top:1px solid var(--b2);background:var(--s1);}
.modal-input{flex:1;border:none;background:var(--s2);border-radius:10px;font-family:inherit;font-size:14px;color:var(--t);padding:11px 14px;outline:none;}
.modal-input::placeholder{color:var(--t3);}
.modal-add-btn{background:var(--a);color:var(--at);border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;padding:11px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ── WEEK ── */
.week-sum{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  border:1px solid var(--b);border-radius:14px;overflow:hidden;margin-bottom:20px;
}
.wsb{background:var(--s1);padding:14px 10px;text-align:center;border-right:1px solid var(--b2);}
.wsb:last-child{border-right:none;}
.wsb .n{font-size:22px;font-weight:300;color:var(--t);display:block;margin-bottom:4px;line-height:1;}
.wsb .l{font-size:8px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;display:block;}

/* Week day rows — vertical list */
.week-list{display:flex;flex-direction:column;gap:8px;}

.wday-row{
  background:var(--s1);border:1px solid var(--b);border-radius:16px;
  padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.wday-row:active{transform:scale(.98);background:var(--s2);}
.wday-row.today{border-color:var(--a);}
.wday-row.today{background:var(--s2);}

/* Mini ring */
.wrow-ring{width:48px;height:48px;flex-shrink:0;position:relative;}
.wrow-ring svg{width:48px;height:48px;transform:rotate(-90deg);display:block;}
.wrow-ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--t);
}

/* Day info */
.wrow-info{flex:1;min-width:0;}
.wrow-name{
  font-size:13px;font-weight:700;color:var(--t);
  display:flex;align-items:center;gap:8px;margin-bottom:3px;
}
.wrow-name .today-badge{
  font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--a);background:rgba(201,255,63,.1);
  padding:2px 7px;border-radius:99px;border:1px solid rgba(201,255,63,.2);
}
.wrow-date{font-size:11px;color:var(--t3);}
.wrow-tasks{font-size:11px;color:var(--t3);margin-top:2px;}
.wrow-tasks .done{color:var(--a);font-weight:600;}

/* Right arrow */
.wrow-arr{
  font-size:18px;color:var(--t3);flex-shrink:0;
  transition:transform .15s;
}
.wday-row:active .wrow-arr{transform:translateX(3px);}

/* Task preview dots */
.wrow-dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.wrow-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}

/* ── ANXIETY ── */
.anx-intro{background:var(--s1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:12px;}
.anx-intro h2{font-size:18px;font-weight:300;margin-bottom:8px;color:var(--t);}
.anx-intro p{font-size:12px;color:var(--t2);line-height:1.9;font-weight:300;}
.anx-intro p b{color:var(--a);font-weight:600;}
.aform{background:var(--s1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:12px;}
.af{margin-bottom:15px;}
.afl{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);margin-bottom:7px;display:block;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--t);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.3px;padding:10px 20px;border-radius:99px;z-index:400;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;}

/* ── PARTICLE ANIMATIONS ── */
.particle-container{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  overflow:hidden;
}
.particle{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  animation:particle-fly var(--dur) ease-out forwards;
  opacity:1;
}
@keyframes particle-fly{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}
}

.energy-text{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  font-weight:800;
  font-size:22px;
  color:var(--a);
  animation:energy-pop .8s cubic-bezier(.34,1.56,.64,1) forwards;
  white-space:nowrap;
}
@keyframes energy-pop{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}
  40%{transform:translate(-50%,-80%) scale(1.1);opacity:1;}
  70%{transform:translate(-50%,-110%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-140%) scale(.8);opacity:0;}
}

.xp-badge{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  background:var(--a);
  color:#111;
  font-weight:800;
  font-size:14px;
  padding:6px 14px;
  border-radius:99px;
  animation:xp-fly 1s cubic-bezier(.34,1.56,.64,1) forwards;
  white-space:nowrap;
}
@keyframes xp-fly{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:0;}
  30%{transform:translate(-50%,-60%) scale(1.1);opacity:1;}
  70%{transform:translate(-50%,-80%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-110%) scale(.9);opacity:0;}
}

// WEEK
function getWT(k){return S.wt[k]||[];}
function addWT(k,txt,cat){if(!txt.trim())return;if(!S.wt[k])S.wt[k]=[];S.wt[k].push({id:Date.now(),text:txt.trim(),cat:cat||'work',done:false});sv();}
function togWT(k,id){var t=(S.wt[k]||[]).find(function(x){return x.id===id;});if(!t)return;t.done=!t.done;sv();}
function delWT(k,id){S.wt[k]=(S.wt[k]||[]).filter(function(x){return x.id!==id;});sv();}

function rWeek(){
  var l=L(),keys=wkeys(),todK=tk(),mon=getMon();
  var wtot=0,wdn=0;
  keys.forEach(function(k){
    var ts=getWT(k);wtot+=ts.length;
    wdn+=ts.filter(function(t){return t.done;}).length;
  });
  document.getElementById('ws1').textContent=wtot;
  document.getElementById('ws2').textContent=wdn;
  document.getElementById('ws3').textContent=wtot?Math.round(wdn/wtot*100)+'%':'0%';

  var list=document.getElementById('week-list');
  list.innerHTML='';

  keys.forEach(function(dayKey,i){
    var d=new Date(mon);d.setDate(mon.getDate()+i);
    var tasks=getWT(dayKey),isToday=(dayKey===todK);
    // Today's ring shows today's tasks from main tracker
    var ringTasks=isToday?(S.tasks[dayKey]||[]).concat(tasks):tasks;
    var dn=ringTasks.filter(function(t){return t.done;}).length,tot=ringTasks.length;
    var dispDn=tasks.filter(function(t){return t.done;}).length,dispTot=tasks.length;
    var pct=tot?Math.round(dn/tot*100):0;

    var row=document.createElement('div');
    row.className='wday-row'+(isToday?' today':'');

    // ── Mini ring ──
    var rDiv=document.createElement('div');rDiv.className='wrow-ring';
    var svgNS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 48 48');
    var cx=24,cy=24,r=19,sw=4,C=2*Math.PI*r;
    // bg circle
    var bgC=document.createElementNS(svgNS,'circle');
    bgC.setAttribute('cx',cx);bgC.setAttribute('cy',cy);bgC.setAttribute('r',r);
    bgC.setAttribute('fill','none');bgC.setAttribute('stroke','var(--s3)');bgC.setAttribute('stroke-width',sw);
    svg.appendChild(bgC);
    if(tot===0){
      // spinning hint arc
      var arcL=(C*0.25).toFixed(1);
      var spinC=document.createElementNS(svgNS,'circle');
      spinC.setAttribute('cx',cx);spinC.setAttribute('cy',cy);spinC.setAttribute('r',r);
      spinC.setAttribute('fill','none');spinC.setAttribute('stroke',S.accent);spinC.setAttribute('stroke-width',sw);
      spinC.setAttribute('stroke-dasharray',arcL+' '+(C-parseFloat(arcL)));
      spinC.setAttribute('stroke-linecap','round');
      spinC.setAttribute('opacity','0.4');
      spinC.setAttribute('class','ring-spin-arc');
      spinC.style.transformOrigin=cx+'px '+cy+'px';
      svg.appendChild(spinC);
    } else {
      var arc=C*(dn/tot);
      var fgC=document.createElementNS(svgNS,'circle');
      fgC.setAttribute('cx',cx);fgC.setAttribute('cy',cy);fgC.setAttribute('r',r);
      fgC.setAttribute('fill','none');fgC.setAttribute('stroke',S.accent);fgC.setAttribute('stroke-width',sw);
      fgC.setAttribute('stroke-dasharray',arc.toFixed(1)+' '+(C-arc).toFixed(1));
      fgC.setAttribute('stroke-linecap','round');
      svg.appendChild(fgC);
    }
    rDiv.appendChild(svg);
    // pct text
    var pctDiv=document.createElement('div');pctDiv.className='wrow-ring-pct';
    pctDiv.textContent=tot?(dn===tot?'✓':pct+'%'):'';
    if(dn===tot&&tot>0)pctDiv.style.color=S.accent;
    rDiv.appendChild(pctDiv);
    row.appendChild(rDiv);

    // ── Info ──
    var info=document.createElement('div');info.className='wrow-info';

    var nameRow=document.createElement('div');nameRow.className='wrow-name';
    nameRow.textContent=l.DF[d.getDay()];
    if(isToday){
      var badge=document.createElement('span');badge.className='today-badge';
      badge.textContent=S.lang==='ru'?'сегодня':'today';
      nameRow.appendChild(badge);
    }
    info.appendChild(nameRow);

    var dateEl=document.createElement('div');dateEl.className='wrow-date';
    dateEl.textContent=d.getDate()+' '+l.MNf[d.getMonth()];
    info.appendChild(dateEl);

    // task summary
    var tsEl=document.createElement('div');tsEl.className='wrow-tasks';
    if(!tot){
      tsEl.textContent=S.lang==='ru'?'Нет задач — нажми чтобы добавить':'No tasks — tap to add';
    } else {
      tsEl.innerHTML='<span class="done">'+dn+'</span> из '+tot+' '+(S.lang==='ru'?'выполнено':'done');
    }
    info.appendChild(tsEl);

    // task color dots
    if(tot>0){
      var dots=document.createElement('div');dots.className='wrow-dots';
      tasks.slice(0,8).forEach(function(t){
        var dot=document.createElement('div');dot.className='wrow-dot';
        var cat=gc(t.cat);
        dot.style.background=t.done?cat.c:'var(--s3)';
        dots.appendChild(dot);
      });
      if(tasks.length>8){
        var more=document.createElement('span');
        more.style.cssText='font-size:9px;color:var(--t3);';
        more.textContent='+'+( tasks.length-8);
        dots.appendChild(more);
      }
      info.appendChild(dots);
    }

    row.appendChild(info);

    // arrow
    var arr=document.createElement('div');arr.className='wrow-arr';arr.textContent='›';
    row.appendChild(arr);

    (function(dk,di){row.onclick=function(){openModal(dk,di,mon);};})(dayKey,i);
    list.appendChild(row);
  });
}


// MODAL
function openModal(dayKey,dayIdx,mon){
  mKey=dayKey;mMon=mon;
  if(!S.wcat[dayKey])S.wcat[dayKey]='work';
  var l=L(),d=new Date(mon);d.setDate(mon.getDate()+dayIdx);
  document.getElementById('m-day').textContent=l.DF[d.getDay()];
  document.getElementById('m-date').textContent=d.getDate()+' '+l.MN[d.getMonth()];
  // cat selector
  var mc=document.getElementById('m-cats');mc.innerHTML='';
  S.cats.forEach(function(cat){
    var el=document.createElement('div');
    el.className='mcat'+(S.wcat[dayKey]===cat.id?' on':'');
    el.style.cssText=S.wcat[dayKey]===cat.id?'border-color:'+cat.c+';color:'+cat.c+';background:'+rg(cat.c,.1):'';
    var dot=document.createElement('span');dot.className='d';dot.style.background=cat.c;
    var nm=document.createElement('span');nm.textContent=cl(cat.id);
    el.appendChild(dot);el.appendChild(nm);
    (function(cid,e2){e2.onclick=function(){
      S.wcat[dayKey]=cid;sv();
      mc.querySelectorAll('.mcat').forEach(function(b){b.className='mcat';b.style.cssText='';});
      var cat2=gc(cid);
      e2.className='mcat on';e2.style.cssText='border-color:'+cat2.c+';color:'+cat2.c+';background:'+rg(cat2.c,.1);
    };})(cat.id,el);
    mc.appendChild(el);
  });
  rModalTasks();
  document.getElementById('modal-ov').classList.add('open');
  setTimeout(function(){document.getElementById('m-inp').focus();},300);
}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');mKey=null;}
function rModalTasks(){

// STATS
function rStats(){
  var l=L(),keys=wkeys(),todK=tk(),mon=getMon();
  var tot=0,dn=0,cm={};S.cats.forEach(function(c){cm[c.id]={t:0,d:0};});
  var dps=keys.map(function(k){var ts=(S.tasks[k]||[]).concat(S.wt[k]||[]),d=ts.filter(function(t){return t.done;}).length;tot+=ts.length;dn+=d;ts.forEach(function(t){if(t.cat&&cm[t.cat]){cm[t.cat].t++;if(t.done)cm[t.cat].d++;}});return ts.length?Math.round(d/ts.length*100):0;});
  var pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('an1').textContent=tot;document.getElementById('an2').textContent=dn;document.getElementById('an3').textContent=tot?pct+'%':'—';
  var mp=Math.max.apply(null,dps.concat([1]));
  document.getElementById('bch').innerHTML=keys.map(function(k,i){var d=new Date(mon);d.setDate(mon.getDate()+i);var p=dps[i],col=p>=75?S.accent:p>=40?rg(S.accent,.6):p>0?rg(S.accent,.3):'var(--s3)';return '<div class="bc'+(k===todK?' tod':'')+'"><div class="bo"><div class="bf" style="height:'+Math.round(p/mp*100)+'%;background:'+col+'"></div></div></div>';}).join('');
  document.getElementById('blbls').innerHTML=keys.map(function(k,i){var d=new Date(mon);d.setDate(mon.getDate()+i);return '<div style="flex:1;text-align:center;font-size:8px;font-weight:700;color:'+(k===todK?S.accent:'var(--t3)')+';letter-spacing:.5px;text-transform:uppercase">'+l.DS[d.getDay()]+'</div>';}).join('');
  var ac=S.cats.filter(function(c){return cm[c.id]&&cm[c.id].t>0;}).sort(function(a,b){return cm[b.id].t-cm[a.id].t;});
  var mx=ac.length?Math.max.apply(null,ac.map(function(c){return cm[c.id].t;})):1;
  document.getElementById('bdrows').innerHTML=ac.length?ac.map(function(c){return '<div class="bdr"><div class="bdd" style="background:'+c.c+'"></div><div class="bdn" style="color:'+c.c+'">'+cl(c.id)+'</div><div class="bdb"><div class="bdf" style="width:'+Math.round(cm[c.id].t/mx*100)+'%;background:'+c.c+'"></div></div><div class="bdc">'+cm[c.id].d+'/'+cm[c.id].t+'</div></div>';}).join(''):'<div class="empty"><div class="et">'+l.noD+'</div></div>';
  var ins=[];
  if(!tot)ins.push({i:'📋',t:l.i0[0],b:l.i0[1]});
  else if(pct>=75)ins.push({i:'💪',t:l.i75[0],b:pct+l.i75[1]});
  else if(pct>=45)ins.push({i:'📈',t:l.i45[0],b:pct+l.i45[1]});
  else ins.push({i:'🌱',t:l.iL[0],b:l.iL[1]});
  if(ac.length){var top=ac[0],cv=cm[top.id];ins.push({i:'🎯',t:l.iF[0]+cl(top.id),b:cv.t+' '+l.iF[1]+(cv.d===cv.t?l.iF[2]:cv.d+l.iF[3]+cv.t+'.')});}
  var ng=null;ac.forEach(function(c){if(!ng&&cm[c.id].t>0&&cm[c.id].d/cm[c.id].t<0.35)ng=c;});
  if(ng){var xv=cm[ng.id];ins.push({i:'⚠️',t:cl(ng.id)+l.iA[0],b:xv.d+l.iA[1]+xv.t+l.iA[2]});}
  var md=Math.max.apply(null,dps),di=dps.indexOf(md);
  if(md>0){var dd=new Date(mon);dd.setDate(mon.getDate()+di);ins.push({i:'⚡',t:l.iB[0]+l.DF[dd.getDay()],b:md+l.iB[1]});}
  if(S.anx.length){var avg=Math.round(S.anx.reduce(function(s,a){return s+a.level;},0)/S.anx.length);ins.push({i:'🧘',t:l.iX[0],b:S.anx.length+l.iX[1]+avg+'/10.'});}
  document.getElementById('ilist').innerHTML=ins.map(function(it){return '<div class="ii"><div class="iii">'+it.i+'</div><div><div class="iit">'+it.t+'</div><div class="iib">'+it.b+'</div></div></div>';}).join('');
}

var activeTutorial=null;
var tutStep=0;

function showTutorial(tab){
  var key='tut_done_'+tab;
  if(localStorage.getItem(key)==='1')return;
  var data=TUTORIALS[tab];
  if(!data)return;
  activeTutorial=tab;
  tutStep=0;
  var el=document.getElementById('tab-tutorial');
  el.style.display='flex';
  renderTutorial();
}

function renderTutorial(){
  if(!activeTutorial)return;
  var lang=S.lang==='ru'?'ru':'en';
  var steps=TUTORIALS[activeTutorial][lang];
  if(!steps||tutStep>=steps.length){tutorialDone();return;}
  var s=steps[tutStep];
  document.getElementById('tut-step').textContent=s.step;
  document.getElementById('tut-title').textContent=s.title;
  document.getElementById('tut-desc').innerHTML=s.desc;
  var isLast=tutStep>=steps.length-1;
  document.getElementById('tut-btn').textContent=isLast?(S.lang==='ru'?'Понятно!':'Got it!'):(S.lang==='ru'?'Далее →':'Next →');
  document.getElementById('tut-skip').textContent=S.lang==='ru'?'Пропустить':'Skip';
}

function tutNext(){
  var lang=S.lang==='ru'?'ru':'en';
  var steps=TUTORIALS[activeTutorial][lang];
  if(tutStep<steps.length-1){tutStep++;renderTutorial();}
  else tutorialDone();
}

function tutorialDone(){
  if(activeTutorial) localStorage.setItem('tut_done_'+activeTutorial,'1');
  activeTutorial=null;
  var el=document.getElementById('tab-tutorial');
  el.style.opacity='0';
  setTimeout(function(){el.style.display='none';el.style.opacity='1';},300);
}

    }]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = url;
  document.head.appendChild(link);
})();

</script>
